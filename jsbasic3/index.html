<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load and Clear Table</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .completed { color: green; font-weight: bold; }
        .pending { color: red; font-weight: bold; }
    </style>
</head> 
<body>
    <h1>Javascript Web Output #3</h1>

    <label for="apiInput">API:</label>
    <input type="text" id="apiInput" value="https://jsonplaceholder.typicode.com/todos/">
    <button onclick="updateApiUrl()">Set API</button>
    
    <br><br>

    <button onclick="loadData()">Load Data From The API</button>
    <button onclick="clearTable()">Clear Table</button>

    <br><br>

    <a id="apiLink" href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
        https://jsonplaceholder.typicode.com/todos/
    </a>

    <table id="dataTable">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Task ID</th>
                <th>Title</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <script>
        let apiUrl = document.getElementById('apiInput').value;

        async function loadData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const tableBody = document.querySelector('#dataTable tbody');
                tableBody.innerHTML = ''; // Clear table before loading new data
                
                data.forEach(item => {
                    const statusClass = item.completed ? 'completed' : 'pending';
                    const statusText = item.completed ? 'Completed' : 'Pending';
                    
                    const row = `
                        <tr>
                            <td>${item.userId}</td>
                            <td>${item.id}</td>
                            <td>${item.title}</td>
                            <td class="${statusClass}">${statusText}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function clearTable() {
            document.querySelector('#dataTable tbody').innerHTML = '';
        }

        function updateApiUrl() {
            apiUrl = document.getElementById('apiInput').value;
            document.getElementById('apiLink').href = apiUrl;
            alert(`API URL set to: ${apiUrl}`);
        }
    </script>
    
</body>
</html>
